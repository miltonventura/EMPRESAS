{% extends 'base.html' %}
{% from 'macros.html' import csrf %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="tarjeta" style="max-width: 380px; margin: 3rem auto;">
  <h1>{{ nombre_clinica() }}</h1>
  <p class="ayuda">Acceso para el personal de la clínica.</p>
  <form method="post">
    {{ csrf() }}
    <p><label for="usuario">Usuario</label><input type="text" id="usuario" name="usuario" required autofocus autocomplete="username"></p>
    <p><label for="password">Contraseña</label><input type="password" id="password" name="password" required autocomplete="current-password"></p>
    <button>Ingresar</button>
  </form>
</div>
{% endblock %}
